<svg xmlns="http://www.w3.org/2000/svg" width="400" height="420" viewBox="0 0 400 420">
  <g fill="none" stroke="#58A6FF" stroke-opacity="0.09" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- envelope -->
    <g transform="translate(40,50)">
      <rect x="0" y="0" width="48" height="32" rx="3"/>
      <path d="M0,3 L24,20 L48,3"/>
    </g>

    <!-- chat bubble with typing dots -->
    <g transform="translate(150,90)">
      <path d="M0,4 Q0,0 4,0 L40,0 Q44,0 44,4 L44,22 Q44,26 40,26 L14,26 L6,34 L6,26 L4,26 Q0,26 0,22 Z"/>
      <circle cx="12" cy="13" r="1.6" fill="#58A6FF" fill-opacity="0.14" stroke="none"/>
      <circle cx="22" cy="13" r="1.6" fill="#58A6FF" fill-opacity="0.14" stroke="none"/>
      <circle cx="32" cy="13" r="1.6" fill="#58A6FF" fill-opacity="0.14" stroke="none"/>
    </g>

    <!-- paper airplane -->
    <g transform="translate(240,55) rotate(20)">
      <path d="M0,14 L44,0 L18,28 L14,20 Z"/>
      <path d="M18,28 L24,18 L14,20 Z"/>
    </g>

    <!-- at symbol -->
    <text x="315" y="130" font-family="Arial, sans-serif" font-size="34" fill="#58A6FF" fill-opacity="0.1" stroke="none">@</text>

    <!-- phone handset -->
    <g transform="translate(70,190)">
      <path d="M0,4 Q0,0 4,0 L12,0 Q15,0 16,3 Q18,9 21,12 Q24,15 20,19 Q26,29 36,35 Q40,31 43,33 Q46,34 52,36 Q55,37 55,40 L55,48 Q55,52 51,52 Q28,50 13,35 Q-2,20 0,4 Z"/>
    </g>

    <!-- message card with text lines -->
    <g transform="translate(200,195)">
      <rect x="0" y="0" width="80" height="50" rx="4"/>
      <line x1="12" y1="14" x2="60" y2="14"/>
      <line x1="12" y1="24" x2="68" y2="24"/>
      <line x1="12" y1="34" x2="46" y2="34"/>
    </g>

    <!-- bell -->
    <g transform="translate(330,210)">
      <path d="M0,0 Q0,-10 10,-10 Q20,-10 20,0 L20,12 L24,18 L-4,18 L0,12 Z"/>
      <path d="M7,18 Q10,23 13,18"/>
    </g>

    <!-- connecting dotted lines -->
    <path d="M88,66 L120,66 L120,100 L150,100" stroke-dasharray="1 5"/>
    <path d="M270,80 L270,110 L318,110" stroke-dasharray="1 5"/>
    <path d="M150,190 L150,160 L200,160 L200,200" stroke-dasharray="1 5"/>

    <!-- lower cluster -->
    <g transform="translate(30,300)">
      <rect x="0" y="0" width="48" height="32" rx="3"/>
      <path d="M0,3 L24,20 L48,3"/>
    </g>

    <g transform="translate(130,320) rotate(-14)">
      <path d="M0,14 L38,0 L16,24 L12,17 Z"/>
      <path d="M16,24 L21,15 L12,17 Z"/>
    </g>

    <text x="230" y="345" font-family="Arial, sans-serif" font-size="30" fill="#58A6FF" fill-opacity="0.1" stroke="none">@</text>

    <g transform="translate(60,375)">
      <path d="M0,4 Q0,0 4,0 L36,0 Q40,0 40,4 L40,20 Q40,24 36,24 L13,24 L6,31 L6,24 L4,24 Q0,24 0,20 Z"/>
      <circle cx="11" cy="12" r="1.5" fill="#58A6FF" fill-opacity="0.14" stroke="none"/>
      <circle cx="20" cy="12" r="1.5" fill="#58A6FF" fill-opacity="0.14" stroke="none"/>
      <circle cx="29" cy="12" r="1.5" fill="#58A6FF" fill-opacity="0.14" stroke="none"/>
    </g>

    <g transform="translate(280,300)">
      <rect x="0" y="0" width="70" height="46" rx="4"/>
      <line x1="10" y1="12" x2="52" y2="12"/>
      <line x1="10" y1="21" x2="60" y2="21"/>
      <line x1="10" y1="30" x2="40" y2="30"/>
    </g>

    <g transform="translate(230,380)">
      <path d="M0,0 Q0,-9 9,-9 Q18,-9 18,0 L18,10 L22,16 L-4,16 L0,10 Z"/>
      <path d="M6,16 Q9,20.5 12,16"/>
    </g>

    <path d="M78,342 L78,362 L130,362" stroke-dasharray="1 5"/>
    <path d="M350,300 L370,300 L370,296" stroke-dasharray="1 5"/>
  </g>
</svg>
