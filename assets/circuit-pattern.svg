<svg xmlns="http://www.w3.org/2000/svg" width="400" height="420" viewBox="0 0 400 420">
  <g fill="none" stroke="#58A6FF" stroke-opacity="0.09" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

    <!-- IC chip -->
    <g transform="translate(40,50)">
      <rect x="0" y="0" width="44" height="32" rx="2"/>
      <line x1="6" y1="0" x2="6" y2="-8"/>
      <line x1="16" y1="0" x2="16" y2="-8"/>
      <line x1="28" y1="0" x2="28" y2="-8"/>
      <line x1="38" y1="0" x2="38" y2="-8"/>
      <line x1="6" y1="32" x2="6" y2="40"/>
      <line x1="16" y1="32" x2="16" y2="40"/>
      <line x1="28" y1="32" x2="28" y2="40"/>
      <line x1="38" y1="32" x2="38" y2="40"/>
    </g>

    <!-- resistor -->
    <g transform="translate(150,90)">
      <line x1="0" y1="8" x2="10" y2="8"/>
      <polyline points="10,8 14,0 20,16 26,0 32,16 38,0 42,8"/>
      <line x1="42" y1="8" x2="52" y2="8"/>
    </g>

    <!-- capacitor -->
    <g transform="translate(230,60)">
      <line x1="0" y1="10" x2="14" y2="10"/>
      <line x1="14" y1="0" x2="14" y2="20"/>
      <line x1="20" y1="0" x2="20" y2="20"/>
      <line x1="20" y1="10" x2="34" y2="10"/>
    </g>

    <!-- crystal oscillator -->
    <g transform="translate(320,110)">
      <rect x="0" y="0" width="10" height="20" rx="2"/>
      <line x1="-10" y1="10" x2="0" y2="10"/>
      <line x1="10" y1="10" x2="20" y2="10"/>
    </g>

    <!-- PCB board with mounting holes + IC + header -->
    <g transform="translate(60,180)">
      <rect x="0" y="0" width="90" height="60" rx="3"/>
      <circle cx="8" cy="8" r="3"/>
      <circle cx="82" cy="8" r="3"/>
      <circle cx="8" cy="52" r="3"/>
      <circle cx="82" cy="52" r="3"/>
      <rect x="20" y="18" width="24" height="24" rx="2"/>
      <line x1="55" y1="20" x2="75" y2="20"/>
      <line x1="55" y1="28" x2="75" y2="28"/>
      <line x1="55" y1="36" x2="75" y2="36"/>
    </g>

    <!-- pin header connector -->
    <g transform="translate(220,200)">
      <circle cx="0" cy="0" r="2"/>
      <circle cx="10" cy="0" r="2"/>
      <circle cx="20" cy="0" r="2"/>
      <circle cx="30" cy="0" r="2"/>
      <rect x="-5" y="-6" width="40" height="12" rx="1"/>
    </g>

    <!-- MCU dev board -->
    <g transform="translate(300,190)">
      <rect x="0" y="0" width="70" height="46" rx="4"/>
      <rect x="6" y="6" width="18" height="14" rx="1"/>
      <circle cx="60" cy="10" r="2"/>
      <circle cx="60" cy="20" r="2"/>
      <circle cx="60" cy="30" r="2"/>
      <line x1="6" y1="30" x2="30" y2="30"/>
      <line x1="6" y1="36" x2="30" y2="36"/>
    </g>

    <!-- connecting traces -->
    <path d="M84,66 L110,66 L110,98 L150,98"/>
    <path d="M282,66 L282,90 L320,90"/>
    <path d="M150,180 L150,150 L230,150 L230,120"/>
    <path d="M260,206 L300,206"/>

    <!-- vias -->
    <circle cx="110" cy="66" r="2" fill="#58A6FF" fill-opacity="0.12" stroke="none"/>
    <circle cx="150" cy="98" r="2" fill="#58A6FF" fill-opacity="0.12" stroke="none"/>
    <circle cx="230" cy="120" r="2" fill="#58A6FF" fill-opacity="0.12" stroke="none"/>

    <!-- lower cluster -->
    <g transform="translate(30,300)">
      <rect x="0" y="0" width="44" height="32" rx="2"/>
      <line x1="6" y1="0" x2="6" y2="-8"/>
      <line x1="16" y1="0" x2="16" y2="-8"/>
      <line x1="28" y1="0" x2="28" y2="-8"/>
      <line x1="38" y1="0" x2="38" y2="-8"/>
      <line x1="6" y1="32" x2="6" y2="40"/>
      <line x1="16" y1="32" x2="16" y2="40"/>
      <line x1="28" y1="32" x2="28" y2="40"/>
      <line x1="38" y1="32" x2="38" y2="40"/>
    </g>

    <g transform="translate(140,330) rotate(15)">
      <line x1="0" y1="8" x2="10" y2="8"/>
      <polyline points="10,8 14,0 20,16 26,0 32,16 38,0 42,8"/>
      <line x1="42" y1="8" x2="52" y2="8"/>
    </g>

    <g transform="translate(220,310)">
      <line x1="0" y1="10" x2="14" y2="10"/>
      <line x1="14" y1="0" x2="14" y2="20"/>
      <line x1="20" y1="0" x2="20" y2="20"/>
      <line x1="20" y1="10" x2="34" y2="10"/>
    </g>

    <g transform="translate(280,300)">
      <rect x="0" y="0" width="90" height="60" rx="3"/>
      <circle cx="8" cy="8" r="3"/>
      <circle cx="82" cy="8" r="3"/>
      <circle cx="8" cy="52" r="3"/>
      <circle cx="82" cy="52" r="3"/>
      <rect x="20" y="18" width="24" height="24" rx="2"/>
      <line x1="55" y1="20" x2="75" y2="20"/>
      <line x1="55" y1="28" x2="75" y2="28"/>
      <line x1="55" y1="36" x2="75" y2="36"/>
    </g>

    <g transform="translate(60,400)">
      <circle cx="0" cy="0" r="2"/>
      <circle cx="10" cy="0" r="2"/>
      <circle cx="20" cy="0" r="2"/>
      <circle cx="30" cy="0" r="2"/>
      <rect x="-5" y="-6" width="40" height="12" rx="1"/>
    </g>

    <g transform="translate(150,398)">
      <rect x="0" y="0" width="10" height="20" rx="2"/>
      <line x1="-10" y1="10" x2="0" y2="10"/>
      <line x1="10" y1="10" x2="20" y2="10"/>
    </g>

    <path d="M74,340 L74,370 L140,370"/>
    <path d="M370,330 L398,330 L398,400"/>
  </g>
</svg>
